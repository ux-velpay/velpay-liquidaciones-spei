<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Liquidaciones — Por liquidar | Velpay Backoffice</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
<style>
  :root{
    --vel-purple-900:#2d006d;
    --vel-purple-700:#2e016e;
    --vel-purple-500:#754bf1;
    --vel-bg:#f3f4f6;
    --vel-border:#e5e7eb;
    --vel-row-border:#eaecf0;
    --vel-text:#292828;
    --vel-text-secondary:#374151;
    --vel-muted:#6f6f6f;
    --vel-green-bg:#defedd;
    --vel-red-bg:#ffdede;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Work Sans',-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
    background:var(--vel-bg);
    color:var(--vel-text);
    min-width:1024px;
  }

  .vel-header{background:var(--vel-purple-900);display:flex;align-items:center;justify-content:space-between;padding:18px 48px;}
  .vel-header-left{display:flex;align-items:center;gap:14px;}
  .vel-brand{display:flex;align-items:center;gap:10px;color:#fff;font-size:18px;font-weight:500;}
  .vel-brand-mark{width:24px;height:24px;border:2px solid #fff;transform:rotate(45deg);border-radius:4px;}
  .vel-brand-sep{width:1px;height:22px;background:rgba(255,255,255,0.35);}
  .vel-nav{display:flex;align-items:center;gap:16px;margin-left:70px;}
  .vel-nav a{color:#fff;font-size:14px;font-weight:500;text-decoration:none;padding:10px 24px;border-radius:40px;white-space:nowrap;}
  .vel-nav a.active{background:#fff;color:var(--vel-purple-700);}
  .vel-header-actions{display:flex;align-items:center;gap:16px;}
  .vel-header-actions svg{stroke:#fff;}
  .vel-avatar{width:29px;height:29px;border-radius:50%;background:#8b6cf0;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;}

  .vel-content{padding:28px 48px 60px;}
  .vel-page-title{color:var(--vel-purple-900);font-size:28px;font-weight:600;margin:0 0 20px;}

  .vel-tabs{display:flex;gap:4px;border-bottom:1px solid var(--vel-border);margin-bottom:20px;}
  .vel-tab{background:none;border:none;font:inherit;font-size:15px;padding:12px 16px;cursor:pointer;color:var(--vel-text-secondary);border-bottom:2px solid transparent;margin-bottom:-1px;}
  .vel-tab.active{color:var(--vel-purple-500);font-weight:600;border-bottom-color:var(--vel-purple-500);}

  .vel-toolbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;gap:16px;}
  .vel-summary-card{background:#fff;border:1px solid var(--vel-border);border-radius:6px;box-shadow:0 1px 2px rgba(16,24,40,0.05);padding:20px 24px;width:320px;flex-shrink:0;}
  .vel-summary-card .vel-dot{display:inline-block;width:12px;height:12px;background:var(--vel-purple-500);border-radius:1px;margin-right:8px;}
  .vel-summary-card .vel-label{color:#6b7280;font-size:16px;}
  .vel-summary-card .vel-value{font-size:25px;font-weight:600;color:var(--vel-text);margin:8px 0 0;font-variant-numeric:tabular-nums;}

  .vel-btn-primary{background:var(--vel-purple-900);color:#fbfbfb;border:none;border-radius:9px;font:inherit;font-weight:500;font-size:16px;padding:14px 22px;cursor:pointer;}
  .vel-btn-primary:hover{background:#3a0a8c;}
  .vel-btn-primary:focus-visible{outline:2px solid var(--vel-purple-500);outline-offset:2px;}

  .vel-filter-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:16px;flex-wrap:wrap;}
  .vel-search-wrap{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--vel-border);border-radius:6px;padding:12px 15px;flex:1;max-width:520px;}
  .vel-search-wrap svg{stroke:#a0a0a0;flex-shrink:0;}
  .vel-search-wrap input{border:none;outline:none;font:inherit;font-size:16px;color:var(--vel-text);flex:1;background:none;}
  .vel-search-wrap input::placeholder{color:#a0a0a0;}
  .vel-results-count{color:var(--vel-purple-700);font-size:14px;font-weight:500;white-space:nowrap;}

  .vel-filter-right{display:flex;align-items:center;gap:14px;}
  .vel-date-filter{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--vel-border);border-radius:6px;box-shadow:0 1px 2px rgba(16,24,40,0.05);padding:10px 16px;font-size:14px;color:#292828;cursor:pointer;}
  .vel-date-filter svg{stroke:#292828;}
  .vel-date-filter .vel-info{stroke:#9ca3af;}

  .vel-segment-group{display:flex;background:#e5e7eb;border-radius:8px;padding:4px;}
  .vel-segment{background:none;border:none;font:inherit;font-size:15px;font-weight:500;padding:8px 16px;border-radius:8px;cursor:pointer;color:#374151;}
  .vel-segment.active{background:#fff;color:#111827;box-shadow:0 1px 1.5px rgba(0,0,0,0.06);}
  .vel-segment:focus-visible, .vel-tab:focus-visible, .vel-page-btn:focus-visible{outline:2px solid var(--vel-purple-500);outline-offset:1px;}

  .vel-table-wrap table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border-radius:12px;border:1px solid var(--vel-border);}
  .vel-table-wrap thead th{text-align:left;font-size:14px;font-weight:500;padding:14px 20px;color:#000;background:#f9fafb;border:none;border-bottom:1px solid var(--vel-border);}
  .vel-table-wrap thead th:first-child{border-top-left-radius:12px;}
  .vel-table-wrap thead th:last-child{border-top-right-radius:12px;}
  .vel-table-wrap tbody td{padding:16px 20px;font-size:14px;color:var(--vel-text);border-bottom:1px solid var(--vel-row-border);font-variant-numeric:tabular-nums;}
  .vel-table-wrap tbody tr:last-child td{border-bottom:none;}
  .vel-table-wrap tbody tr:last-child td:first-child{border-bottom-left-radius:12px;}
  .vel-table-wrap tbody tr:last-child td:last-child{border-bottom-right-radius:12px;}
  .vel-table-wrap tbody tr:hover td{background:#fafafa;}
  .vel-amount-liquidar{color:var(--vel-purple-500);font-weight:600;}
  .vel-delta{display:inline-flex;align-items:center;gap:6px;color:#464646;}
  .vel-delta .vel-delta-icon{width:20px;height:20px;border-radius:2px;display:inline-flex;align-items:center;justify-content:center;}
  .vel-delta.up .vel-delta-icon{background:var(--vel-green-bg);}
  .vel-delta.up svg{stroke:#1d9e75;}
  .vel-delta.down .vel-delta-icon{background:var(--vel-red-bg);}
  .vel-delta.down svg{stroke:#d85a30;}
  .vel-row-actions{color:#9ca3af;cursor:pointer;}
  .vel-btn-dispersar{background:var(--vel-purple-500);color:#fff;border:none;border-radius:6px;font:inherit;font-weight:500;font-size:13px;padding:8px 16px;cursor:pointer;white-space:nowrap;}
  .vel-btn-dispersar:hover{background:#6238e0;}
  .vel-btn-dispersar:focus-visible{outline:2px solid var(--vel-purple-900);outline-offset:2px;}

  .vel-pagination{display:flex;justify-content:flex-end;align-items:center;gap:6px;padding:20px 0;}
  .vel-page-btn{min-width:32px;height:32px;border-radius:8px;border:none;background:none;font:inherit;font-size:14px;font-weight:500;color:#464646;cursor:pointer;}
  .vel-page-btn.active{background:var(--vel-purple-900);color:#fff;}
  .vel-page-dots{color:var(--vel-muted);font-weight:600;}
  .vel-page-arrow{width:32px;height:32px;border-radius:8px;border:none;background:none;display:flex;align-items:center;justify-content:center;color:#464646;cursor:pointer;}
  .vel-page-arrow svg{stroke:#464646;}

  .vel-empty-state{background:#fff;border:1px solid var(--vel-border);border-radius:6px;padding:60px 20px;text-align:center;color:#6b7280;font-size:14px;}
  .vel-empty-state svg{stroke:#b4b2a9;display:block;margin:0 auto 12px;}

  .vel-clickable{cursor:pointer;}
  .vel-clickable:hover td{background:#f6f4ff;}

  .vel-suc-back{display:inline-flex;align-items:center;gap:12px;background:none;border:none;font:inherit;font-size:22px;font-weight:600;color:var(--vel-purple-900);cursor:pointer;padding:0;margin:0 0 26px;}
  .vel-suc-back svg{stroke:var(--vel-purple-900);}
  .vel-suc-card{background:#fff;border:1px solid var(--vel-border);border-radius:12px;box-shadow:0 1px 2px rgba(16,24,40,0.05);overflow:hidden;}
  .vel-suc-header,.vel-suc-row{display:grid;grid-template-columns:1.3fr repeat(9,minmax(0,1fr)) 128px;align-items:center;column-gap:4px;}
  .vel-suc-header{padding:22px 20px;background:#f9fafb;}
  .vel-suc-row{padding:18px 20px;border-top:1px solid var(--vel-row-border);}
  .vel-suc-name{display:flex;align-items:flex-start;gap:9px;color:var(--vel-purple-900);font-size:16px;font-weight:600;line-height:1.25;}
  .vel-suc-name .vel-dot{margin-top:6px;flex-shrink:0;}
  .vel-suc-col{display:flex;flex-direction:column;gap:5px;padding:0 4px;}
  .vel-suc-header .vel-suc-col{border-left:1px solid var(--vel-border);padding-left:12px;}
  .vel-suc-label{font-size:11px;color:var(--vel-muted);line-height:1.25;}
  .vel-suc-val{font-size:13px;font-weight:600;color:var(--vel-text);font-variant-numeric:tabular-nums;}
  .vel-suc-val.liquidar{color:var(--vel-purple-500);}
  .vel-suc-cell{padding:0 4px;font-size:13px;color:var(--vel-text);font-variant-numeric:tabular-nums;}
  .vel-suc-cell.liquidar{color:var(--vel-purple-500);font-weight:600;}
  .vel-suc-sub{display:flex;flex-direction:column;gap:2px;}
  .vel-suc-sub .vel-suc-sub-name{font-size:14px;font-weight:600;color:var(--vel-text);}
  .vel-suc-sub .vel-suc-clabe{font-size:11px;color:var(--vel-muted);}

  .vel-btn-dispersar.loading{background:#8b6cf0;cursor:default;}
  .vel-btn-dispersar:disabled{background:#e5e7eb;color:#9ca3af;cursor:not-allowed;pointer-events:none;}
  .vel-tip{position:relative;display:inline-block;}
  .vel-tip-box{position:absolute;bottom:calc(100% + 8px);right:0;width:230px;background:#2d2d2d;color:#fff;font-size:12px;line-height:1.45;padding:9px 11px;border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,0.22);opacity:0;visibility:hidden;transform:translateY(4px);transition:opacity .15s,transform .15s;z-index:50;pointer-events:none;}
  .vel-tip-box::after{content:"";position:absolute;top:100%;right:16px;border:6px solid transparent;border-top-color:#2d2d2d;}
  .vel-tip:hover .vel-tip-box{opacity:1;visibility:visible;transform:translateY(0);}
  .vel-spinner{width:12px;height:12px;border:2px solid rgba(255,255,255,0.45);border-top-color:#fff;border-radius:50%;display:inline-block;vertical-align:-1px;margin-right:7px;animation:vel-spin .6s linear infinite;}
  @keyframes vel-spin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion: reduce){ .vel-spinner{animation-duration:1.5s;} }

  .vel-toast-host{position:fixed;top:20px;right:20px;display:flex;flex-direction:column;gap:12px;z-index:1000;}
  .vel-toast{display:flex;align-items:flex-start;gap:12px;background:#111827;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,0.2);padding:16px;min-width:360px;max-width:430px;transition:opacity .3s,transform .3s;}
  .vel-toast.leaving{opacity:0;transform:translateX(12px);}
  .vel-toast-ic{flex-shrink:0;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
  .vel-toast.success .vel-toast-ic{background:#1d9e75;}
  .vel-toast.error .vel-toast-ic{background:#e24b4a;}
  .vel-toast.warning .vel-toast-ic{background:#e0a72c;}
  .vel-toast-ic svg{stroke:#fff;}
  .vel-toast-body{flex:1;min-width:0;}
  .vel-toast-title{font-size:14px;font-weight:500;color:#fff;margin:0;line-height:1.35;}
  .vel-toast-msg{font-size:13px;color:#9ca3af;margin:4px 0 0;line-height:1.45;}
  .vel-toast-close{flex-shrink:0;background:none;border:none;padding:0;cursor:pointer;color:#9ca3af;display:flex;align-items:center;justify-content:center;width:20px;height:20px;}
  .vel-toast-close:hover{color:#fff;}
</style>
</head>
<body>
  <header class="vel-header">
    <div class="vel-header-left">
      <div class="vel-brand">
        <span class="vel-brand-mark" aria-hidden="true"></span>
        <span>Velpay</span>
        <div class="vel-brand-sep"></div>
        <span>Backoffice</span>
      </div>
      <nav class="vel-nav" aria-label="Navegación principal">
        <a href="#" data-nav>Dashboard</a>
        <a href="#" data-nav>Reportes</a>
        <a href="#" data-nav class="active" aria-current="page">Liquidaciones</a>
        <a href="#" data-nav>Comercios</a>
        <a href="#" data-nav>Informes</a>
        <a href="#" data-nav>Conciliaciones</a>
      </nav>
    </div>
    <div class="vel-header-actions">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.16.31.4.58.7.76.3.18.63.28.98.24H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      <div class="vel-avatar">IG</div>
    </div>
  </header>

  <main class="vel-content" id="velListView">
    <h1 class="vel-page-title">Liquidaciones</h1>

    <div class="vel-tabs">
      <button class="vel-tab active" data-tab>Por liquidar</button>
      <button class="vel-tab" data-tab>Retenidas</button>
    </div>

    <div class="vel-toolbar">
      <div class="vel-summary-card">
        <div><span class="vel-dot" aria-hidden="true"></span><span class="vel-label">Por liquidar 1/08/24</span></div>
        <p class="vel-value">$410,100.52</p>
      </div>
      <button class="vel-btn-primary" id="velMainAction">Generar layout</button>
    </div>

    <div class="vel-filter-row">
      <div class="vel-search-wrap">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
        <input type="text" id="velSearchInput" placeholder="Busca por Comercio ó ID Comercio" aria-label="Buscar por comercio o ID comercio" />
        <span class="vel-results-count" id="velResultsCount">Mostrando 46 resultados</span>
      </div>
      <div class="vel-filter-right">
        <div class="vel-date-filter" id="velDateFilter">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>
          <span>Fechas de corte</span>
          <svg class="vel-info" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4M12 8h.01"></path></svg>
        </div>
        <div class="vel-segment-group" role="group" aria-label="Origen de liquidación">
          <button class="vel-segment active" data-segment="adquirente" aria-pressed="true">Adquirente</button>
          <button class="vel-segment" data-segment="spei" aria-pressed="false">SPEI</button>
        </div>
      </div>
    </div>

    <div class="vel-table-wrap" id="velTableWrap">
      <table>
        <thead>
          <tr>
            <th>Comercio</th>
            <th>Total trx</th>
            <th>Importe transacciones</th>
            <th>Importe abonos</th>
            <th>Importe cargos</th>
            <th>Importe a liquidar</th>
            <th style="width:40px;"></th>

    <nav class="vel-pagination" id="velPagination" aria-label="Paginación">
      <button class="vel-page-btn active">1</button>
      <button class="vel-page-btn">2</button>
      <button class="vel-page-btn">3</button>
      <button class="vel-page-btn">4</button>
      <button class="vel-page-btn">5</button>
      <button class="vel-page-btn">6</button>
      <button class="vel-page-btn">7</button>
      <span class="vel-page-dots">…</span>
      <button class="vel-page-arrow" aria-label="Página siguiente"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
    </nav>
  </main>

  <section class="vel-content" id="velDetailView" style="display:none;">
    <button class="vel-suc-back" id="velBackBtn">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
      Sucursales
    </button>

    <div class="vel-suc-card" id="velSucCard"></div>
  </section>

  <div class="vel-toast-host" id="velToastHost" aria-live="polite" aria-atomic="false"></div>

<script>
(function(){
  var currentMode = 'adquirente';

  function tableHead(){
    var extra = currentMode === 'spei' ? '<th style="width:120px;"></th>' : '<th style="width:40px;"></th>';
    return '<table><thead><tr><th>Comercio</th><th>Total trx</th><th>Importe transacciones</th><th>Importe abonos</th><th>Importe cargos</th><th>Importe a liquidar</th>' + extra + '</tr></thead><tbody id="velTableBody"></tbody></table>';
  }

  var rows = [];
  for (var i = 0; i < 6; i++){
    rows.push({ comercio: 'Foliatti', trx: 10, transacciones: 99999.00, abonos: 0.00, cargos: -102.03, liquidar: 185000.00 });
  }

  function speiTemplate(){
    return [
      { id:0, comercio:'Brillamont', trx:10, transacciones:99999.00, abonos:0.00, cargos:-102.03, liquidar:185000.00, clabe:'328593285712', scenario:'success', state:'pending' },
      { id:1, comercio:'Brillamont', trx:10, transacciones:99999.00, abonos:0.00, cargos:-102.03, liquidar:185000.00, clabe:'328593285001', scenario:'already', state:'dispersed' },
      { id:2, comercio:'Brillamont', trx:10, transacciones:99999.00, abonos:0.00, cargos:-102.03, liquidar:185000.00, clabe:'328593285777', scenario:'fail', state:'pending' }
    ];
  }
  var speiRows = speiTemplate();

  function activeData(){ return currentMode === 'spei' ? speiRows : rows; }

  function fmt(n){
    return Math.abs(n).toLocaleString('es-MX', {minimumFractionDigits:2, maximumFractionDigits:2});
  }

  var upIcon = '<span class="vel-delta-icon"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"></path></svg></span>';
  var downIcon = '<span class="vel-delta-icon"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 7 7 17M17 17H7V7"></path></svg></span>';
  var dotsIcon = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle></svg>';

  function renderRows(list){
    var wrap = document.getElementById('velTableWrap');
    if (!list.length){
      wrap.innerHTML = '<div class="vel-empty-state"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3v4a1 1 0 0 0 1 1h4"></path><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"></path><path d="m3 3 18 18"></path></svg>No se encontraron comercios con ese criterio de búsqueda.</div>';
      return;
    }
    if (!wrap.querySelector('table')){ wrap.innerHTML = tableHead(); }
    var body = document.getElementById('velTableBody');
    var html = '';
    for (var i = 0; i < list.length; i++){
      var r = list[i];
      var lastCell;
      if (currentMode === 'spei'){
        lastCell = r.state === 'dispersed'
          ? '<td>' + disabledDispersarHTML() + '</td>'
          : '<td><button class="vel-btn-dispersar" data-dispersar data-suc-id="' + r.id + '">Dispersar</button></td>';
      } else {
        lastCell = '<td class="vel-row-actions">' + dotsIcon + '</td>';
      }
      var rowAttrs = currentMode === 'spei' ? ' class="vel-clickable" data-row-open' : '';
      html += '<tr' + rowAttrs + '>' +
        '<td>' + r.comercio + '</td>' +
        '<td>' + r.trx + '</td>' +
        '<td>$' + fmt(r.transacciones) + '</td>' +
        '<td><span class="vel-delta up">' + upIcon + '$' + fmt(r.abonos) + '</span></td>' +
        '<td><span class="vel-delta down">' + downIcon + (r.cargos < 0 ? '-' : '') + '$' + fmt(r.cargos) + '</span></td>' +
        '<td class="vel-amount-liquidar">$' + fmt(r.liquidar) + '</td>' +
        lastCell +
      '</tr>';
    }
    body.innerHTML = html;
  }

  renderRows(rows);

  document.getElementById('velSearchInput').addEventListener('input', function(e){
    var q = e.target.value.trim().toLowerCase();
    var data = activeData();
    var filtered = q ? data.filter(function(r){ return r.comercio.toLowerCase().indexOf(q) !== -1; }) : data;
    renderRows(filtered);
    document.getElementById('velResultsCount').textContent = 'Mostrando ' + filtered.length + ' resultados';
  });

  var pageBtns = document.querySelectorAll('.vel-page-btn');
  for (var p = 0; p < pageBtns.length; p++){
    pageBtns[p].addEventListener('click', function(){
      for (var j = 0; j < pageBtns.length; j++){ pageBtns[j].classList.remove('active'); }
      this.classList.add('active');
    });
  }

  var segments = document.querySelectorAll('.vel-segment');
  for (var s = 0; s < segments.length; s++){
    segments[s].addEventListener('click', function(){
      for (var k = 0; k < segments.length; k++){
        segments[k].classList.remove('active');
        segments[k].setAttribute('aria-pressed', 'false');
      }
      this.classList.add('active');
      this.setAttribute('aria-pressed', 'true');
      currentMode = this.dataset.segment;
      var mainAction = document.getElementById('velMainAction');
      var wrap = document.getElementById('velTableWrap');
      mainAction.style.display = currentMode === 'spei' ? 'none' : '';
      document.getElementById('velDateFilter').style.display = currentMode === 'spei' ? 'none' : '';
      if (currentMode === 'spei'){ speiRows = speiTemplate(); }
      document.getElementById('velSearchInput').value = '';
      wrap.innerHTML = tableHead();
      renderRows(activeData());
      document.getElementById('velResultsCount').textContent = 'Mostrando ' + activeData().length + ' resultados';
    });
  }

  var listView = document.getElementById('velListView');
  var detailView = document.getElementById('velDetailView');
  var sucCard = document.getElementById('velSucCard');

  function intFmt(n){ return n.toLocaleString('es-MX'); }
  function money(n){ return '$' + fmt(n); }

  function sucTemplate(){
    return [
      { name:'Brillamont Centro', clabe:'328593285712', trx:4873, importeTrx:53603, ventas:4873, importeVentas:53603, cancel:0, importeCancel:0, contra:0, importeContra:0, liquidar:52336.02, scenario:'success', state:'pending' },
      { name:'Brillamont Norte',  clabe:'328593285001', trx:1200, importeTrx:12000, ventas:1200, importeVentas:12000, cancel:3, importeCancel:150, contra:0, importeContra:0, liquidar:11700, scenario:'already', state:'dispersed' },
      { name:'Brillamont Sur',    clabe:'328593285777', trx:900,  importeTrx:9000,  ventas:900,  importeVentas:9000,  cancel:1, importeCancel:80,  contra:1, importeContra:200, liquidar:8600, scenario:'fail', state:'pending' }
    ];
  }
  var sucursales = sucTemplate();

  function col(label, val, liq){
    return '<div class="vel-suc-col"><span class="vel-suc-label">' + label + '</span><span class="vel-suc-val' + (liq ? ' liquidar' : '') + '">' + val + '</span></div>';
  }
  function cell(val, liq){ return '<div class="vel-suc-cell' + (liq ? ' liquidar' : '') + '">' + val + '</div>'; }

  function sucRow(s, idx){
    return '<div class="vel-suc-row">' +
      '<div class="vel-suc-sub"><span class="vel-suc-sub-name">' + s.name + '</span><span class="vel-suc-clabe">CLABE ' + s.clabe + '</span></div>' +
      cell(intFmt(s.trx)) + cell(money(s.importeTrx)) + cell(intFmt(s.ventas)) + cell(money(s.importeVentas)) +
      cell(intFmt(s.cancel)) + cell(money(s.importeCancel)) + cell(intFmt(s.contra)) + cell(money(s.importeContra)) +
      cell(money(s.liquidar), true) +
      '<div class="vel-row-actions" style="justify-self:center;">' + dotsIcon + '</div>' +
    '</div>';
  }

  function renderSucursales(){
    var a = { trx:0, importeTrx:0, ventas:0, importeVentas:0, cancel:0, importeCancel:0, contra:0, importeContra:0, liquidar:0 };
    for (var i = 0; i < sucursales.length; i++){
      var s = sucursales[i];
      a.trx += s.trx; a.importeTrx += s.importeTrx; a.ventas += s.ventas; a.importeVentas += s.importeVentas;
      a.cancel += s.cancel; a.importeCancel += s.importeCancel; a.contra += s.contra; a.importeContra += s.importeContra; a.liquidar += s.liquidar;
    }
    var header = '<div class="vel-suc-header">' +
      '<div class="vel-suc-name"><span class="vel-dot" aria-hidden="true"></span><span>Brillamont<br />ecommerce</span></div>' +
      col('Total de trx', intFmt(a.trx)) +
      col('Importe de trx', money(a.importeTrx)) +
      col('Ventas', intFmt(a.ventas)) +
      col('Importe de ventas', money(a.importeVentas)) +
      col('Cancelaciones', intFmt(a.cancel)) +
      col('Importe de cancelaciones', money(a.importeCancel)) +
      col('Contracargos', intFmt(a.contra)) +
      col('Importe de contracargos', money(a.importeContra)) +
      col('Importe a liquidar', money(a.liquidar), true) +
      '<div></div>' +
    '</div>';
    var rows = '';
    for (var j = 0; j < sucursales.length; j++){ rows += sucRow(sucursales[j], j); }
    sucCard.innerHTML = header + rows;
  }

  function openSucursales(){
    sucursales = sucTemplate();
    renderSucursales();
    listView.style.display = 'none';
    detailView.style.display = 'block';
    window.scrollTo(0, 0);
  }

  document.getElementById('velTableWrap').addEventListener('click', function(e){
    var disp = e.target.closest('[data-dispersar]');
    if (disp){ handleDispersar(disp); return; }
    var tr = e.target.closest('[data-row-open]');
    if (!tr) return;
    openSucursales();
  });

  function disabledDispersarHTML(){
    return '<span class="vel-tip"><button class="vel-btn-dispersar" disabled>Dispersar</button>' +
      '<span class="vel-tip-box">Este grupo ya fue dispersado exitosamente. El sistema no genera un nuevo envío a STP.</span></span>';
  }

  function handleDispersar(btn){
    var id = parseInt(btn.getAttribute('data-suc-id'), 10);
    var s = null;
    for (var i = 0; i < speiRows.length; i++){ if (speiRows[i].id === id){ s = speiRows[i]; break; } }
    if (!s) return;

    if (s.state === 'dispersed'){
      showToast('warning', 'Ya dispersado — 409', 'Este grupo ya fue dispersado exitosamente. El sistema no genera un nuevo envío a STP.');
      return;
    }

    btn.disabled = true;
    btn.classList.add('loading');
    btn.innerHTML = '<span class="vel-spinner" aria-hidden="true"></span>Dispersando..';

    setTimeout(function(){
      if (s.scenario === 'success'){
        var uuid = genUUID();
        s.state = 'dispersed';
        var td = btn.closest('td');
        if (td){ td.innerHTML = disabledDispersarHTML(); }
        showToast('success', 'Dispersión exitosa', 'Enviado a STP · ' + money(s.liquidar) + ' → CLABE ****' + s.clabe.slice(-4) + ' · idempotency_key ' + uuid.slice(0, 8) + '… · registrado en log de auditoría.');
      } else {
        var uuid2 = genUUID();
        btn.classList.remove('loading');
        btn.disabled = false;
        btn.textContent = 'Dispersar';
        showToast('error', 'Error en STP', 'La dispersión falló. Las operaciones siguen en estatus pendiente. Código de error registrado en el log. Reintenta con nuevo UUID ' + uuid2.slice(0, 8) + '….');
      }
    }, 1300);
  }

  document.getElementById('velBackBtn').addEventListener('click', function(){
    detailView.style.display = 'none';
    listView.style.display = 'block';
    window.scrollTo(0, 0);
  });

  function genUUID(){
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c){
      var r = (Math.random() * 16) | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
      return v.toString(16);
    });
  }

  var toastIcons = {
    success: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m20 6-11 11-5-5"></path></svg>',
    error:   '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>',
    warning: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v7M12 18h.01"></path></svg>'
  };
  var closeIcon = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>';

  function showToast(type, title, msg){
    var host = document.getElementById('velToastHost');
    var el = document.createElement('div');
    el.className = 'vel-toast ' + type;
    el.innerHTML = '<span class="vel-toast-ic">' + toastIcons[type] + '</span>' +
      '<div class="vel-toast-body"><p class="vel-toast-title">' + title + '</p>' +
      (msg ? '<p class="vel-toast-msg">' + msg + '</p>' : '') + '</div>' +
      '<button class="vel-toast-close" aria-label="Cerrar">' + closeIcon + '</button>';
    host.appendChild(el);
    var remove = function(){
      el.classList.add('leaving');
      setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 300);
    };
    el.querySelector('.vel-toast-close').addEventListener('click', remove);
    setTimeout(remove, 5000);
  }


  var tabs = document.querySelectorAll('.vel-tab');
  for (var t = 0; t < tabs.length; t++){
    tabs[t].addEventListener('click', function(){
      for (var m = 0; m < tabs.length; m++){ tabs[m].classList.remove('active'); }
      this.classList.add('active');
    });
  }
})();
</script>
</body>
</html>
