<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Liquidaciones — Por liquidar | Velpay Backoffice</title>
<style>
  :root{
    --vel-purple-900:#2d006d;
    --vel-purple-700:#2e016e;
    --vel-purple-500:#754bf1;
    --vel-bg:#f3f4f6;
    --vel-border:#e5e7eb;
    --vel-row-border:#eaecf0;
    --vel-text:#292828;
    --vel-text-secondary:#374151;
    --vel-muted:#6f6f6f;
    --vel-green-bg:#defedd;
    --vel-red-bg:#ffdede;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--vel-bg);
    color:var(--vel-text);
    min-width:1024px;
  }

  .vel-header{background:var(--vel-purple-900);display:flex;align-items:center;justify-content:space-between;padding:18px 48px;}
  .vel-header-left{display:flex;align-items:center;gap:14px;}
  .vel-brand{display:flex;align-items:center;gap:10px;color:#fff;font-size:18px;font-weight:500;}
  .vel-brand-mark{width:24px;height:24px;border:2px solid #fff;transform:rotate(45deg);border-radius:4px;}
  .vel-brand-sep{width:1px;height:22px;background:rgba(255,255,255,0.35);}
  .vel-nav{display:flex;align-items:center;gap:16px;margin-left:70px;}
  .vel-nav a{color:#fff;font-size:14px;font-weight:500;text-decoration:none;padding:10px 24px;border-radius:40px;white-space:nowrap;}
  .vel-nav a.active{background:#fff;color:var(--vel-purple-700);}
  .vel-header-actions{display:flex;align-items:center;gap:16px;}
  .vel-header-actions svg{stroke:#fff;}
  .vel-avatar{width:29px;height:29px;border-radius:50%;background:#8b6cf0;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;}

  .vel-content{padding:28px 48px 60px;}
  .vel-page-title{color:var(--vel-purple-900);font-size:28px;font-weight:600;margin:0 0 20px;}

  .vel-tabs{display:flex;gap:4px;border-bottom:1px solid var(--vel-border);margin-bottom:20px;}
  .vel-tab{background:none;border:none;font:inherit;font-size:15px;padding:12px 16px;cursor:pointer;color:var(--vel-text-secondary);border-bottom:2px solid transparent;margin-bottom:-1px;}
  .vel-tab.active{color:var(--vel-purple-500);font-weight:600;border-bottom-color:var(--vel-purple-500);}

  .vel-toolbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;gap:16px;}
  .vel-summary-card{background:#fff;border:1px solid var(--vel-border);border-radius:6px;box-shadow:0 1px 2px rgba(16,24,40,0.05);padding:20px 24px;width:320px;flex-shrink:0;}
  .vel-summary-card .vel-dot{display:inline-block;width:12px;height:12px;background:var(--vel-purple-500);border-radius:1px;margin-right:8px;}
  .vel-summary-card .vel-label{color:#6b7280;font-size:16px;}
  .vel-summary-card .vel-value{font-size:25px;font-weight:600;color:var(--vel-text);margin:8px 0 0;font-variant-numeric:tabular-nums;}

  .vel-btn-primary{background:var(--vel-purple-900);color:#fbfbfb;border:none;border-radius:9px;font:inherit;font-weight:500;font-size:16px;padding:14px 22px;cursor:pointer;}
  .vel-btn-primary:hover{background:#3a0a8c;}
  .vel-btn-primary:focus-visible{outline:2px solid var(--vel-purple-500);outline-offset:2px;}

  .vel-filter-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:16px;flex-wrap:wrap;}
  .vel-search-wrap{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--vel-border);border-radius:6px;padding:12px 15px;flex:1;max-width:520px;}
  .vel-search-wrap svg{stroke:#a0a0a0;flex-shrink:0;}
  .vel-search-wrap input{border:none;outline:none;font:inherit;font-size:16px;color:var(--vel-text);flex:1;background:none;}
  .vel-search-wrap input::placeholder{color:#a0a0a0;}
  .vel-results-count{color:var(--vel-purple-700);font-size:14px;font-weight:500;white-space:nowrap;}

  .vel-filter-right{display:flex;align-items:center;gap:14px;}
  .vel-date-filter{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--vel-border);border-radius:6px;box-shadow:0 1px 2px rgba(16,24,40,0.05);padding:10px 16px;font-size:14px;color:#292828;cursor:pointer;}
  .vel-date-filter svg{stroke:#292828;}
  .vel-date-filter .vel-info{stroke:#9ca3af;}

  .vel-segment-group{display:flex;background:#e5e7eb;border-radius:8px;padding:4px;}
  .vel-segment{background:none;border:none;font:inherit;font-size:15px;font-weight:500;padding:8px 16px;border-radius:8px;cursor:pointer;color:#374151;}
  .vel-segment.active{background:#fff;color:#111827;box-shadow:0 1px 1.5px rgba(0,0,0,0.06);}
  .vel-segment:focus-visible, .vel-tab:focus-visible, .vel-page-btn:focus-visible{outline:2px solid var(--vel-purple-500);outline-offset:1px;}

  .vel-table-wrap table{width:100%;border-collapse:collapse;background:#fff;border-radius:6px;overflow:hidden;}
  .vel-table-wrap thead th{text-align:left;font-size:14px;font-weight:500;padding:14px 20px;color:#000;background:#f9fafb;border:1px solid var(--vel-border);border-bottom:none;}
  .vel-table-wrap thead th:first-child{border-top-left-radius:6px;}
  .vel-table-wrap thead th:last-child{border-top-right-radius:6px;}
  .vel-table-wrap tbody td{padding:16px 20px;font-size:14px;color:var(--vel-text);border-bottom:1px solid var(--vel-row-border);border-left:1px solid var(--vel-row-border);border-right:1px solid var(--vel-row-border);font-variant-numeric:tabular-nums;}
  .vel-table-wrap tbody tr:hover td{background:#fafafa;}
  .vel-amount-liquidar{color:var(--vel-purple-500);font-weight:600;}
  .vel-delta{display:inline-flex;align-items:center;gap:6px;color:#464646;}
  .vel-delta .vel-delta-icon{width:20px;height:20px;border-radius:2px;display:inline-flex;align-items:center;justify-content:center;}
  .vel-delta.up .vel-delta-icon{background:var(--vel-green-bg);}
  .vel-delta.up svg{stroke:#1d9e75;}
  .vel-delta.down .vel-delta-icon{background:var(--vel-red-bg);}
  .vel-delta.down svg{stroke:#d85a30;}
  .vel-row-actions{color:#9ca3af;cursor:pointer;}

  .vel-pagination{display:flex;justify-content:flex-end;align-items:center;gap:6px;padding:20px 0;}
  .vel-page-btn{min-width:32px;height:32px;border-radius:8px;border:none;background:none;font:inherit;font-size:14px;font-weight:500;color:#464646;cursor:pointer;}
  .vel-page-btn.active{background:var(--vel-purple-900);color:#fff;}
  .vel-page-dots{color:var(--vel-muted);font-weight:600;}
  .vel-page-arrow{width:32px;height:32px;border-radius:8px;border:none;background:none;display:flex;align-items:center;justify-content:center;color:#464646;cursor:pointer;}
  .vel-page-arrow svg{stroke:#464646;}

  .vel-empty-state{background:#fff;border:1px solid var(--vel-border);border-radius:6px;padding:60px 20px;text-align:center;color:#6b7280;font-size:14px;}
  .vel-empty-state svg{stroke:#b4b2a9;display:block;margin:0 auto 12px;}
</style>
</head>
<body>
  <header class="vel-header">
    <div class="vel-header-left">
      <div class="vel-brand">
        <span class="vel-brand-mark" aria-hidden="true"></span>
        <span>Velpay</span>
        <div class="vel-brand-sep"></div>
        <span>Backoffice</span>
      </div>
      <nav class="vel-nav" aria-label="Navegación principal">
        <a href="#" data-nav>Dashboard</a>
        <a href="#" data-nav>Reportes</a>
        <a href="#" data-nav class="active" aria-current="page">Liquidaciones</a>
        <a href="#" data-nav>Comercios</a>
        <a href="#" data-nav>Informes</a>
        <a href="#" data-nav>Conciliaciones</a>
      </nav>
    </div>
    <div class="vel-header-actions">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.16.31.4.58.7.76.3.18.63.28.98.24H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      <div class="vel-avatar">IG</div>
    </div>
  </header>

  <main class="vel-content">
    <h1 class="vel-page-title">Liquidaciones</h1>

    <div class="vel-tabs">
      <button class="vel-tab active" data-tab>Por liquidar</button>
      <button class="vel-tab" data-tab>Retenidas</button>
    </div>

    <div class="vel-toolbar">
      <div class="vel-summary-card">
        <div><span class="vel-dot" aria-hidden="true"></span><span class="vel-label">Por liquidar 1/08/24</span></div>
        <p class="vel-value">$410,100.52</p>
      </div>
      <button class="vel-btn-primary" id="velMainAction">Generar layout</button>
    </div>

    <div class="vel-filter-row">
      <div class="vel-search-wrap">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
        <input type="text" id="velSearchInput" placeholder="Busca por Comercio ó ID Comercio" aria-label="Buscar por comercio o ID comercio" />
      </div>
      <span class="vel-results-count" id="velResultsCount">Mostrando 46 resultados</span>
      <div class="vel-filter-right">
        <div class="vel-date-filter">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>
          <span>Fechas de corte</span>
          <svg class="vel-info" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4M12 8h.01"></path></svg>
        </div>
        <div class="vel-segment-group" role="group" aria-label="Origen de liquidación">
          <button class="vel-segment active" data-segment="adquirente" aria-pressed="true">Adquirente</button>
          <button class="vel-segment" data-segment="spei" aria-pressed="false">SPEI</button>
        </div>
      </div>
    </div>

    <div class="vel-table-wrap" id="velTableWrap">
      <table>
        <thead>
          <tr>
            <th>Comercio</th>
            <th>Total trx</th>
            <th>Importe transacciones</th>
            <th>Importe abonos</th>
            <th>Importe cargos</th>
            <th>Importe a liquidar</th>
            <th style="width:40px;"></th>
          </tr>
        </thead>
        <tbody id="velTableBody"></tbody>
      </table>
    </div>

    <nav class="vel-pagination" id="velPagination" aria-label="Paginación">
      <button class="vel-page-btn active">1</button>
      <button class="vel-page-btn">2</button>
      <button class="vel-page-btn">3</button>
      <button class="vel-page-btn">4</button>
      <button class="vel-page-btn">5</button>
      <button class="vel-page-btn">6</button>
      <button class="vel-page-btn">7</button>
      <span class="vel-page-dots">…</span>
      <button class="vel-page-arrow" aria-label="Página siguiente"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
    </nav>
  </main>

<script>
(function(){
  var TABLE_HEAD = '<table><thead><tr><th>Comercio</th><th>Total trx</th><th>Importe transacciones</th><th>Importe abonos</th><th>Importe cargos</th><th>Importe a liquidar</th><th style="width:40px;"></th></tr></thead><tbody id="velTableBody"></tbody></table>';

  var rows = [];
  for (var i = 0; i < 6; i++){
    rows.push({ comercio: 'Foliatti', trx: 10, transacciones: 99999.00, abonos: 0.00, cargos: -102.03, liquidar: 185000.00 });
  }

  function fmt(n){
    return Math.abs(n).toLocaleString('es-MX', {minimumFractionDigits:2, maximumFractionDigits:2});
  }

  var upIcon = '<span class="vel-delta-icon"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"></path></svg></span>';
  var downIcon = '<span class="vel-delta-icon"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 7 7 17M17 17H7V7"></path></svg></span>';
  var dotsIcon = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle></svg>';

  function renderRows(list){
    var wrap = document.getElementById('velTableWrap');
    if (!list.length){
      wrap.innerHTML = '<div class="vel-empty-state"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3v4a1 1 0 0 0 1 1h4"></path><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"></path><path d="m3 3 18 18"></path></svg>No se encontraron comercios con ese criterio de búsqueda.</div>';
      return;
    }
    if (!wrap.querySelector('table')){ wrap.innerHTML = TABLE_HEAD; }
    var body = document.getElementById('velTableBody');
    var html = '';
    for (var i = 0; i < list.length; i++){
      var r = list[i];
      html += '<tr>' +
        '<td>' + r.comercio + '</td>' +
        '<td>' + r.trx + '</td>' +
        '<td>$' + fmt(r.transacciones) + '</td>' +
        '<td><span class="vel-delta up">' + upIcon + '$' + fmt(r.abonos) + '</span></td>' +
        '<td><span class="vel-delta down">' + downIcon + (r.cargos < 0 ? '-' : '') + '$' + fmt(r.cargos) + '</span></td>' +
        '<td class="vel-amount-liquidar">$' + fmt(r.liquidar) + '</td>' +
        '<td class="vel-row-actions">' + dotsIcon + '</td>' +
      '</tr>';
    }
    body.innerHTML = html;
  }

  renderRows(rows);

  document.getElementById('velSearchInput').addEventListener('input', function(e){
    var q = e.target.value.trim().toLowerCase();
    var filtered = q ? rows.filter(function(r){ return r.comercio.toLowerCase().indexOf(q) !== -1; }) : rows;
    renderRows(filtered);
    document.getElementById('velResultsCount').textContent = 'Mostrando ' + filtered.length + ' resultados';
  });

  var pageBtns = document.querySelectorAll('.vel-page-btn');
  for (var p = 0; p < pageBtns.length; p++){
    pageBtns[p].addEventListener('click', function(){
      for (var j = 0; j < pageBtns.length; j++){ pageBtns[j].classList.remove('active'); }
      this.classList.add('active');
    });
  }

  var segments = document.querySelectorAll('.vel-segment');
  for (var s = 0; s < segments.length; s++){
    segments[s].addEventListener('click', function(){
      for (var k = 0; k < segments.length; k++){
        segments[k].classList.remove('active');
        segments[k].setAttribute('aria-pressed', 'false');
      }
      this.classList.add('active');
      this.setAttribute('aria-pressed', 'true');
      var mode = this.dataset.segment;
      var mainAction = document.getElementById('velMainAction');
      var wrap = document.getElementById('velTableWrap');
      if (mode === 'spei'){
        mainAction.textContent = 'Dispersar';
        wrap.innerHTML = '<div class="vel-empty-state"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 3"></path></svg>Vista SPEI — agrupamiento por Comercio + Sucursal, CLABE y dispersión (26028-VEL-BO). Próxima iteración de este prototipo.</div>';
      } else {
        mainAction.textContent = 'Generar layout';
        wrap.innerHTML = TABLE_HEAD;
        renderRows(rows);
      }
    });
  }

  var tabs = document.querySelectorAll('.vel-tab');
  for (var t = 0; t < tabs.length; t++){
    tabs[t].addEventListener('click', function(){
      for (var m = 0; m < tabs.length; m++){ tabs[m].classList.remove('active'); }
      this.classList.add('active');
    });
  }
})();
</script>
</body>
</html>
